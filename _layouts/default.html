<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fi' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-branding">
        <a class="site-branding-link" href="{{ '/' | relative_url }}">
          <img class="site-logo" src="{{ '/kuvat/fii.svg' | relative_url }}" width="44" height="44" alt="" aria-hidden="true">
          <span class="site-branding-text">
            <span class="site-title">{{ site.title | default: "Fyysikkokillan varjo-opinto-opas" }}</span>
            {% if site.description %}
              <span class="site-description">{{ site.description }}</span>
            {% endif %}
          </span>
        </a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Etusivu</a>
        <a href="{{ '/kurssit/' | relative_url }}">Kurssit</a>
        {% if site.github.repository_url %}
          <a href="{{ site.github.repository_url }}">GitHub</a>
        {% endif %}
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>
        Fyysikkokillan varjo-opinto-opas
        {% if site.github.repository_url %}
          · <a href="{{ site.github.repository_url }}">GitHub</a>
        {% endif %}
      </p>
    </div>
  </footer>
</body>
</html>
